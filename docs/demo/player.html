<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Paseo Desk：手机发起、Mac 接续的 30 秒脱敏流程演示。">
  <meta name="color-scheme" content="light">
  <title>Paseo Desk · 手机发起，Mac 接续</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f3e8;color:#203e31;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
    main{max-width:1100px;margin:0 auto;padding:36px 24px 28px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:30px}
    .brand{font-size:22px;font-weight:750;letter-spacing:-.5px}.repo{color:#315941;text-decoration:none;border-bottom:1px solid #a9b89a;padding-bottom:3px;font-size:14px}
    h1{font-size:clamp(28px,4vw,42px);letter-spacing:-1px;margin:0 0 10px;line-height:1.25}.intro{font-size:16px;color:#5b6b55;margin:0 0 24px;line-height:1.8}
    .player{position:relative;border-radius:16px;overflow:hidden;background:#1c3327;box-shadow:0 12px 36px #213b2b16;aspect-ratio:16/9}
    video{display:block;width:100%;height:100%;background:#1c3327}.start{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border:1px solid #ffffff66;border-radius:50px;background:#1d4737ed;color:white;padding:17px 25px;display:flex;align-items:center;gap:12px;font:600 17px system-ui;cursor:pointer;box-shadow:0 8px 28px #0003;white-space:nowrap}
    .start:hover{background:#183f2f}.start:focus-visible,a:focus-visible{outline:3px solid #bdcf9f;outline-offset:4px}.start[hidden]{display:none}.start svg{width:21px;height:21px;fill:currentColor}
    .below{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;margin-top:18px;font-size:14px;color:#61725b}.below a{color:#315941}.note{font-size:13px;color:#6b7863;line-height:1.8;margin:24px 0 0;padding-top:18px;border-top:1px solid #d7dfcc}
    #message{color:#894225;line-height:1.7;font-size:14px}footer{margin-top:24px;font-size:12px;color:#71816a}footer a{color:inherit}@media(max-width:600px){main{padding:22px 14px}.player{border-radius:10px}header{margin-bottom:28px}.start{font-size:14px;padding:12px 18px}.intro{font-size:14px}}
  </style>
</head>
<body>
<main>
  <header><div class="brand">Paseo Desk</div><a class="repo" href="https://github.com/SuperFCR/Paseo-Desk">GitHub 项目 ↗</a></header>
  <h1>手机发起，Mac 接续。</h1>
  <p class="intro">同一个工作台，继续同一个任务。30 秒了解手机与电脑如何协作。</p>
  <div class="player">
    <video id="demo" controls playsinline preload="metadata" poster="poster.png" aria-label="手机与 Mac 接续的脱敏演示视频">
      <source src="paseo-phone-mac.mp4" type="video/mp4">
      当前浏览器不支持播放，请使用下方链接下载 MP4。
    </video>
    <button class="start" id="start" type="button" aria-label="播放 30 秒演示视频" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v18l15-9z"/></svg><span>播放 30 秒演示</span></button>
  </div>
  <p id="message" role="status" hidden></p>
  <div class="below"><span>30 秒 · 720p · 无声演示</span><a href="paseo-phone-mac.mp4" download>下载 MP4（255 KiB）↓</a></div>
  <p class="note">流程示意 / 虚构数据 · 界面由代码重建，非真实录屏。人物、账号、主机、路径与结果均为虚构示例。<br>本片展示手机与 Mac 客户端接续，不代表 macOS 工作站部署已通过实机验收。</p>
  <footer>SuperFCR · <a href="https://github.com/SuperFCR/Paseo-Desk/blob/main/docs/demo/README.md">制作说明与开源源码</a></footer>
</main>
<script>
  const video = document.getElementById('demo');
  const button = document.getElementById('start');
  const message = document.getElementById('message');
  const showError = () => {
    message.textContent = '当前浏览器未能播放视频。可以刷新重试，或下载 MP4 后使用系统播放器打开。';
    message.hidden = false;
  };
  button.hidden = false;
  button.addEventListener('click', async () => {
    if (video.ended) video.currentTime = 0;
    try { await video.play(); } catch { showError(); }
  });
  video.addEventListener('play', () => { button.hidden = true; message.hidden = true; });
  video.addEventListener('pause', () => { button.hidden = false; });
  video.addEventListener('ended', () => {
    button.querySelector('span').textContent = '重新播放';
    button.setAttribute('aria-label', '重新播放演示视频');
    button.hidden = false;
  });
  video.addEventListener('error', showError);
</script>
</body>
</html>
