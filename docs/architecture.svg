<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260">
<title>Paseo 多用户工作站架构</title>
<desc>每人独立Linux身份、Paseo及代理进程，共享程序与网络，通过 SSH 访问远程计算节点。</desc>
<style>text{font-family:"Heiti SC","PingFang SC","Microsoft YaHei",sans-serif}</style>
<rect x="0" y="0" width="1800" height="1260" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/>
<text x="48" y="63" font-size="42" fill="#17243A" font-weight="600" text-anchor="start">Paseo 多用户开发工作站</text>
<text x="48" y="108" font-size="25" fill="#5C6B80" font-weight="400" text-anchor="start">共享程序、网络与宿主资源；每人独立身份、进程、目录、会话与模型登录。</text>
<rect x="60" y="150" width="480" height="102" rx="18" fill="#EEF5FF" stroke="#B7CCE8" stroke-width="2"/>
