<text x="675" y="536" font-size="23" fill="#17243A" font-weight="400" text-anchor="start">以 bob 身份运行 Paseo 后台服务</text>
<text x="675" y="573" font-size="23" fill="#17243A" font-weight="400" text-anchor="start">CC / Codex 各自启动独立进程</text>
<text x="675" y="610" font-size="23" fill="#17243A" font-weight="400" text-anchor="start">/home/bob：个人工作目录</text>
