<text x="300" y="229" font-size="23" fill="#2966AA" font-weight="400" text-anchor="middle">Paseo 客户端或自建网页</text>
<line x1="300" y1="252" x2="300" y2="349" stroke="#2966AA" stroke-width="3"/>
<polygon points="300,349 294.345448056554,337.2941876694152 305.654551943446,337.2941876694152" fill="#2966AA"/>
<text x="300" y="287" font-size="22" fill="#2966AA" font-weight="400" text-anchor="middle">Tailscale 身份 → 专属端口 6767</text>
<text x="300" y="320" font-size="22" fill="#5C6B80" font-weight="400" text-anchor="middle">独立实例密码</text>
<rect x="660" y="150" width="480" height="102" rx="18" fill="#EEF5FF" stroke="#B7CCE8" stroke-width="2"/>
<text x="900" y="192" font-size="28" fill="#2966AA" font-weight="600" text-anchor="middle">bob 的手机 / 笔记本</text>
<text x="900" y="229" font-size="23" fill="#2966AA" font-weight="400" text-anchor="middle">Paseo 客户端或自建网页</text>
<line x1="900" y1="252" x2="900" y2="349" stroke="#2966AA" stroke-width="3"/>
<polygon points="900,349 894.345448056554,337.2941876694152 905.654551943446,337.2941876694152" fill="#2966AA"/>
<text x="900" y="287" font-size="22" fill="#2966AA" font-weight="400" text-anchor="middle">Tailscale 身份 → 专属端口 6768</text>
<text x="900" y="320" font-size="22" fill="#5C6B80" font-weight="400" text-anchor="middle">独立实例密码</text>
<rect x="1260" y="150" width="480" height="102" rx="18" fill="#EEF5FF" stroke="#B7CCE8" stroke-width="2"/>
<text x="1500" y="192" font-size="28" fill="#2966AA" font-weight="600" text-anchor="middle">user n 的手机 / 笔记本</text>
<text x="1500" y="229" font-size="23" fill="#2966AA" font-weight="400" text-anchor="middle">Paseo 客户端或自建网页</text>
<line x1="1500" y1="252" x2="1500" y2="349" stroke="#2966AA" stroke-width="3"/>
<polygon points="1500,349 1494.345448056554,337.2941876694152 1505.654551943446,337.2941876694152" fill="#2966AA"/>
<text x="1500" y="287" font-size="22" fill="#2966AA" font-weight="400" text-anchor="middle">Tailscale 身份 → 专属端口 6769…</text>
<text x="1500" y="320" font-size="22" fill="#5C6B80" font-weight="400" text-anchor="middle">独立实例密码</text>
<rect x="40" y="350" width="1720" height="640" rx="24" fill="#F9FAFD" stroke="#C9D3E2" stroke-width="2"/>
<text x="75" y="397" font-size="31" fill="#17243A" font-weight="600" text-anchor="start">常开本地 PC  |  Linux / WSL 运行层</text>
<text x="1725" y="397" font-size="24" fill="#5C6B80" font-weight="400" text-anchor="end">24 小时在线 · 大容量存储</text>
<text x="75" y="426" font-size="21" fill="#5C6B80" font-weight="400" text-anchor="start">WSL 场景：Windows Tailscale 地址经 portproxy 转入 WSL；端口为示例。</text>
<rect x="75" y="448" width="500" height="315" rx="16" fill="#F2EFFA" stroke="#C9BFE1" stroke-width="2"/>
<text x="100" y="492" font-size="29" fill="#6753A5" font-weight="600" text-anchor="start">Linux 用户：alice</text>
<text x="550" y="492" font-size="24" fill="#6753A5" font-weight="600" text-anchor="end">6767</text>
<text x="100" y="536" font-size="23" fill="#17243A" font-weight="400" text-anchor="start">以 alice 身份运行 Paseo 后台服务</text>
<text x="100" y="573" font-size="23" fill="#17243A" font-weight="400" text-anchor="start">CC / Codex 各自启动独立进程</text>
<text x="100" y="610" font-size="23" fill="#17243A" font-weight="400" text-anchor="start">/home/alice：个人工作目录</text>
<text x="100" y="647" font-size="23" fill="#17243A" font-weight="400" text-anchor="start">.paseo / .codex / .claude</text>
<text x="100" y="684" font-size="23" fill="#17243A" font-weight="400" text-anchor="start">.ssh / projects / results</text>
<text x="100" y="721" font-size="23" fill="#17243A" font-weight="400" text-anchor="start">独立密码 · 独立登录缓存</text>
