<text x="675" y="684" font-size="23" fill="#17243A" font-weight="400" text-anchor="start">.ssh / projects / results</text>
<text x="675" y="721" font-size="23" fill="#17243A" font-weight="400" text-anchor="start">独立密码 · 独立登录缓存</text>
<rect x="1225" y="448" width="500" height="315" rx="16" fill="#F2EFFA" stroke="#C9BFE1" stroke-width="2"/>
<text x="1250" y="492" font-size="29" fill="#6753A5" font-weight="600" text-anchor="start">Linux 用户：user n</text>
<text x="1700" y="492" font-size="24" fill="#6753A5" font-weight="600" text-anchor="end">6769…</text>
<text x="1250" y="536" font-size="23" fill="#17243A" font-weight="400" text-anchor="start">以 user n 身份运行 Paseo 后台服务</text>
<text x="1250" y="573" font-size="23" fill="#17243A" font-weight="400" text-anchor="start">CC / Codex 各自启动独立进程</text>
<text x="1250" y="610" font-size="23" fill="#17243A" font-weight="400" text-anchor="start">/home/user-n：个人工作目录</text>
<text x="1250" y="647" font-size="23" fill="#17243A" font-weight="400" text-anchor="start">.paseo / .codex / .claude</text>
<text x="1250" y="684" font-size="23" fill="#17243A" font-weight="400" text-anchor="start">.ssh / projects / results</text>
<text x="1250" y="721" font-size="23" fill="#17243A" font-weight="400" text-anchor="start">独立密码 · 独立登录缓存</text>
<rect x="75" y="792" width="500" height="119" rx="14" fill="#FFF5E5" stroke="#E8CD9B" stroke-width="2"/>
<text x="325" y="828" font-size="26" fill="#A56414" font-weight="600" text-anchor="middle">公共程序与规则</text>
<text x="325" y="864" font-size="22" fill="#17243A" font-weight="400" text-anchor="middle">统一安装 CC / Codex / Paseo</text>
<text x="325" y="894" font-size="20" fill="#5C6B80" font-weight="400" text-anchor="middle">管理员维护；Skills 模板只读</text>
<rect x="650" y="792" width="500" height="119" rx="14" fill="#FFF5E5" stroke="#E8CD9B" stroke-width="2"/>
<text x="900" y="828" font-size="26" fill="#A56414" font-weight="600" text-anchor="middle">共享网络与宿主资源</text>
<text x="900" y="864" font-size="22" fill="#17243A" font-weight="400" text-anchor="middle">统一网络 / 代理 / CPU / 内存</text>
<text x="900" y="894" font-size="20" fill="#5C6B80" font-weight="400" text-anchor="middle">存储容量按用户及项目授权</text>
<rect x="1225" y="792" width="500" height="119" rx="14" fill="#FFF5E5" stroke="#E8CD9B" stroke-width="2"/>
<text x="1475" y="828" font-size="26" fill="#A56414" font-weight="600" text-anchor="middle">模型账号与额度</text>
<text x="1475" y="864" font-size="22" fill="#17243A" font-weight="400" text-anchor="middle">每人自行登录 Codex / Claude</text>
<text x="1475" y="894" font-size="20" fill="#5C6B80" font-weight="400" text-anchor="middle">个人订阅、团队席位或 API Key；凭据不共写</text>
<text x="900" y="952" font-size="22" fill="#5C6B80" font-weight="400" text-anchor="middle">用户隔离依赖真实 Linux UID 与文件权限；管理员与共享网络仍在共同信任边界内。</text>
<line x1="900" y1="992" x2="900" y2="1040" stroke="#187D70" stroke-width="3"/>
